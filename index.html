<script>
/* Zen mode: hide the text, button and footer and just watch the animation (nothing moves). Toggle with the eye button or Z; Esc exits. */
(function () {
  var root = document.documentElement, btn = document.getElementById('zen'), idleT = 0;
  if (!btn) return;
  function wake() {          // show the exit button for a moment, then let it fade away again
    root.classList.remove('zen-idle'); clearTimeout(idleT);
    if (root.classList.contains('zen')) idleT = setTimeout(function () { root.classList.add('zen-idle'); }, 2600);
  }
  function set(on) {
    root.classList.toggle('zen', on); btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (!on) { root.classList.remove('zen-idle'); clearTimeout(idleT); } else wake();
  }
  btn.addEventListener('click', function (e) { e.stopPropagation(); set(!root.classList.contains('zen')); btn.blur(); });
  addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'z' || e.key === 'Z') set(!root.classList.contains('zen'));
    else if (e.key === 'Escape' && root.classList.contains('zen')) set(false);
  });
  ['mousemove', 'pointerdown', 'touchstart'].forEach(function (t) { addEventListener(t, wake, { passive: true }); });
})();
</script>
