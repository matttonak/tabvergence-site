<h1>Feedback</h1>
<p>Found a bug, or have an idea? Tell me below.</p>
<form id="fb" class="fb" novalidate>
<label for="msg">What's on your mind?</label>
<textarea id="msg" rows="6" required placeholder="Found a bug or have an idea? Tell me here."></textarea>
<label for="em">Email <span>(optional, only if you'd like a reply)</span></label>
<input id="em" type="email" autocomplete="email" placeholder="you@example.com">
<input id="site" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" class="trap">
<button class="btn" type="submit">Send feedback</button>
<p id="status" role="status"></p>
</form>
<script>
(function(){
var form=document.getElementById('fb'),msg=document.getElementById('msg'),em=document.getElementById('em'),st=document.getElementById('status'),btn=form.querySelector('button');
var URL='https://docs.google.com/forms/d/e/1FAIpQLSdZvOfj-b8zzKgCYjRuUpHWNLCMXqpUKwKkh9X7NtroJkQ_5g/formResponse';
form.addEventListener('submit',function(e){
  e.preventDefault();
  if(document.getElementById('site').value){return}            // spam trap
  if(!msg.value.trim()){st.className='err';st.textContent='Please write a message first.';msg.focus();return}
  btn.disabled=true;st.className='';st.textContent='Sending…';
  var d=new URLSearchParams();
  d.append('entry.1064964528',msg.value.trim());
  d.append('entry.887360684',em.value.trim());
  d.append('fvv','1');d.append('pageHistory','0');
  fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:d.toString()})
   .then(function(){form.reset();btn.disabled=false;st.className='ok';st.textContent='Thanks, got it.'})
   .catch(function(){btn.disabled=false;st.className='err';st.textContent='Something went wrong. Please try again in a bit.'});
});
})();
</script>
